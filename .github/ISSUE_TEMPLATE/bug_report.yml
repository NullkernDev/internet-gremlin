name: Bug report
description: Something about the Gremlin is broken (not just rude).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please don't include personal data or URLs of private pages.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 142, Edge 141, Brave 1.80…
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
  - type: input
    id: version
    attributes:
      label: Internet Gremlin version
      placeholder: 1.0.0 (shown at the bottom of the Settings page)
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: Any errors from chrome://extensions → Internet Gremlin → Errors.
      render: text
