name: Release

# Bump "version" in package.json on main and this workflow tags the commit,
# builds the extension and publishes the GitHub release. It can also be run
# by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

# Never publish two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.version.outputs.exists == 'false'
      - run: npm run typecheck
        if: steps.version.outputs.exists == 'false'
      - run: npm run lint
        if: steps.version.outputs.exists == 'false'
      - run: npm test
        if: steps.version.outputs.exists == 'false'
      - run: npm run build
        if: steps.version.outputs.exists == 'false'
      - run: npm run package
        if: steps.version.outputs.exists == 'false'

      - name: Write release notes
        if: steps.version.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"
          {
            echo "<p align=\"center\"><img src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/assets/hero.png\" alt=\"Internet Gremlin\" width=\"720\"></p>"
            echo
            echo "**Your browser. Its territory. Your problem.**"
            echo
            echo "## Install in 2 minutes"
            echo
            echo "1. Download **internet-gremlin-v${VERSION}.zip** below and unzip it."
            echo "2. Open \`chrome://extensions\` (or \`edge://extensions\`) and turn on **Developer mode**."
            echo "3. Click **Load unpacked** and select the unzipped folder (the one containing \`manifest.json\`)."
            echo "4. Visit any website. Refresh tabs that were already open."
            echo
            echo "Full guide and troubleshooting: [README](https://github.com/${GITHUB_REPOSITORY}#install-it-no-coding-experience-needed)"
            echo
            echo "## What's new"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[/ { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "---"
            echo "100% offline · no data collected · MIT licensed"
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "release/internet-gremlin-${TAG}.zip" \
            "promo/demo.mp4#internet-gremlin-demo.mp4" \
            --target "$GITHUB_SHA" \
            --title "Internet Gremlin ${TAG}" \
            --notes-file release-notes.md \
            --latest
